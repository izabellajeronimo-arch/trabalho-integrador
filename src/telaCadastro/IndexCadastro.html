<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174d36">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/jpeg" href="../images/Logótipo Ecológico de Gota e Folhas.png">
</head>
<body>
    <main class="tela-Login">
        <div class="decoracao">
            <div class="carrossel">
                <div class="slides" id="slides">
                    <div class="slide" style="background-image: linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, transparent 40%), url('../images/image_162cf75d.jpg');">
                            <p class="slide-texto">Cosméticos naturais inspirados na natureza.</p>
                    </div>
                    <div class="slide" style="background-image: linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, transparent 40%), url('../images/image_cd464f40.jpg');">

                        <p class="slide-texto">Cuidado sustentável para a sua pele todos os dias.</p>
                    </div>
                    <div class="slide" style="background-image: linear-gradient(to top, rgba(0, 0, 0, 0.6), 0%, transparent 40%), url('../images/image_e714a556.jpg');">
                        <p class="slide-texto">100% vegano, livre de crueldade e eco-friendly.</p>
                    </div>
                    <div class="slide" style="background-image: linear-gradient(to bottom, rgba(90, 187, 85, 0.75), rgba(19, 81, 15, 0.85)), url('../images/NOME-DA-SUA-FOTO.jpg');">
                        <p class="slide-texto">Texto que você quiser mostrar nessa foto.</p>
                    </div>
                </div>

                <div class="titulo-overlay">
                    <h1><span class="titulo1">Eco</span><span class="titulo2">Skin</span></h1>
                </div>

                <button class="seta anterior" id="prev">&#10094;</button>
                <button class="seta proximo" id="next">&#10095;</button>

                <div class="indicadores" id="indicadores">
                    <span class="ponto ativo" data-index="0"></span>
                    <span class="ponto" data-index="1"></span>
                    <span class="ponto" data-index="2"></span>
                </div>
            </div>
        </div>
        <div class="dados">
            <div class="login-form">
                <div class="titulo-Cadastro"><span class="Cadastro"><h3>Cadastro</h3></span></div>
                <div class="input-container-Cadastro">
                    <form id="meuForm" action="../telaCadastro/Cadastro.html" method="post">
                        <div class="input-container">
                            <input type="text" name="username/emial" placeholder="Nome de Usuário ou email" required minlength="8" class="inputNome-Email" id="nome/email">
                            <input type="password" name="password" placeholder="Senha" required minlength="8" class="inputSenha" id="senha">
                            <input type="password" name="re-password" placeholder="Confirmar a Senha" required minlength="8" class="inputSenha" id="confirmar">
                        </div>
                    </form>
                </div>
                <div class="botoes">
                    <button type="submit" form="meuForm" class="buttonCadastrar" id="Cadastrar">Cadastre-se</button>
                    <a href="../telaLogin/indexLogin.html" class="link"><button type="button" class="buttonEntrar">Entrar</button></a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
