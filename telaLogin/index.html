<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174d36">
    <title>Entrar</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>
    <main class="tela-Login">
        <div class="decoracao">
            <div class="titulo">
            <h1><span class="titulo1">Eco</span><span class="titulo2">Skin</span></h1>
            </div>
        </div>
        <div class="dados">
            <div class="login-form">
                <span class="Entrar"><h3>Login</h3></span>
                <div class="input-container">
                <form action="../index.html" method="post">
                    <div class="input-container">
                    <input type="text" name="username" placeholder="Usuário" required minlength="8" class="inputNome">
                    <input type="password" name="password" placeholder="Senha" required minlength="8" class="inputSenha">
                    </div>
                </form>
                <div class="botoes">
                    <button type="submit" class="buttonEntrar">Entrar</button>
                    <button class="buttonCadastro"><a href="../telaCadastro/index.html" class="link">Cadastre-se</a></button>
                </div>
            </div>
                
            </div>
        </div>
    </main>
</body>
</html>
