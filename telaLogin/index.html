<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174d36">
    <title>Entrar</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>
    <main class="tela-Login">
        <div class="titulo">
            <h1><span class="titulo1">Eco</span><span class="titulo2">Skin</span></h1>
        </div>
        <section class="pagina-login">
            <div class="login-form">
                <span class="Entrar">Entrar</span>
                <form action="../index.html" method="post">
                    <input type="text" name="username" placeholder="Usuário" required>
                    <input type="password" name="password" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
                <p><a href="../telaCadastro/index.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>
</body>
</html>
